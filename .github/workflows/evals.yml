name: Evaluations

# Semantic regression runs against the frozen 12-paper corpus.
# Automatic pull-request and master runs are temporarily disabled. Run the
# priority or full inventory manually when needed.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        type: choice
        options: [priority, full]
        default: full
permissions:
  # Needed to commit the results history back to master.
  contents: write

concurrency:
  # A new push to a pull request replaces its stale run. Master runs queue and
  # are never cancelled, so no baseline is lost.
  group: evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A failing suite fails the job. The 0.75/0.95 minimums in
  # evals/regression/runner.py are still placeholders, so today this mostly
  # catches incomplete runs and evaluator crashes rather than score drift.
  ENFORCE_THRESHOLDS: "true"
  EMBEDDING_CACHE_VERSION: "v2"
  # One upload switch for individual evals and regression suites. If this
  # repository variable is absent, uploads stay off.
  EVAL_UPLOAD_TO_LANGSMITH: ${{ vars.EVAL_UPLOAD_TO_LANGSMITH || 'false' }}
  # Selects evals.runtime from application.yaml for both ingestion and evals.
  ARXIV_RAG_RUNTIME: "eval"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Written as a file because the Cloudflare Access variable names contain
      # hyphens, which shells cannot export. python-dotenv reads them fine.
      - name: Write .env from secrets
        env:
          OLLAMA_CF_SECRET: ${{ secrets.OLLAMA_CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat > .env <<ENV
          OLLAMA_BASE_URL=${{ secrets.OLLAMA_BASE_URL }}
          CF_ACCESS_CLIENT_ID=${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET=${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OLLAMA_CF_ACCESS_CLIENT_ID=${{ secrets.OLLAMA_CF_ACCESS_CLIENT_ID }}
          OLLAMA_CF_ACCESS_CLIENT_SECRET=$OLLAMA_CF_SECRET
          GENERATOR_MODEL=${{ secrets.GENERATOR_MODEL }}
          JUDGE_MODEL=${{ secrets.JUDGE_MODEL }}
          COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          LANGSMITH_TRACING=false
          LANGSMITH_ENDPOINT=${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT=${{ secrets.LANGSMITH_PROJECT }}
          ENV

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate eval runtime
        run: >-
          uv run python -c "from arxiv_rag.util import activate_eval_runtime;
          activate_eval_runtime()"

      # The corpus is the 12 committed HTML files, so the same inputs always
      # produce the same embeddings. Rebuild only when an input changes.
      - name: Restore Chroma corpus
        id: chroma
        uses: actions/cache@v4
        with:
          path: chroma_db
          key: >-
            chroma-${{ runner.os }}-${{ env.EMBEDDING_CACHE_VERSION }}-${{
              hashFiles('data/raw/sampled_html/**', 'application.yaml',
              'src/arxiv_rag/ingestion/**',
              'src/arxiv_rag/loading/**', 'uv.lock')
            }}

      - name: Build Chroma corpus
        if: steps.chroma.outputs.cache-hit != 'true'
        run: uv run python -m arxiv_rag.ingestion.ingestion_pipeline

      - name: Run evaluation suite
        id: evaluate
        continue-on-error: true
        env:
          SUITE: ${{ inputs.suite || 'priority' }}
        run: |
          uv run python -m "evals.regression.run_${SUITE}" \
            --results-json regression-results.json \
            --results-dir evals/results

      - name: Write job summary
        if: always()
        run: |
          if [ -f regression-results.json ]; then
            uv run python -m evals.regression.summary regression-results.json \
              --output "$GITHUB_STEP_SUMMARY"
          else
            echo "## 💥 No results file." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Artifacts expire. This is the history that stays in the repository, and
      # it records failed runs too, which are the ones worth looking back at.
      # Manual runs commit to the branch selected when the workflow is launched.
      - name: Commit results history
        if: >-
          always() && (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch')
        env:
          SUITE: ${{ inputs.suite || 'priority' }}
        run: |
          if [ -z "$(git status --porcelain evals/results)" ]; then
            echo "No results file to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/results
          git commit -m "Record ${SUITE} evaluation run ${GITHUB_RUN_ID}"
          git pull --rebase --autostash
          git push

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            regression-results-${{ inputs.suite || 'priority' }}-${{
              github.run_id
            }}
          path: regression-results.json
          if-no-files-found: warn

      - name: Report suite status
        if: always()
        run: |
          if [ "${{ steps.evaluate.outcome }}" = "success" ]; then
            echo "Suite passed."
            exit 0
          fi
          if [ "${ENFORCE_THRESHOLDS}" = "true" ]; then
            echo "Suite failed and thresholds are enforced."
            exit 1
          fi
          echo "Suite failed; thresholds are not enforced. Report-only run."
