[project]
name = "arxiv-rag"
version = "0.0.1"
description = "An evidence-grounded reading assistant for language-centric GenAI research."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
# Sprint 1 needs to fetch papers and compare three extractors. Nothing else is
# installed until a sprint demands it.
fetch = ["arxiv>=2.1", "httpx>=0.28"]
extract = ["pypdf>=6.0", "pymupdf>=1.24", "pymupdf4llm>=0.0.30"]
# docling ships ~1GB of layout models. Separate group so it is opted into, not
# dragged in by every sync.
extract-docling = ["docling>=2.60"]
dev = [
    "langsmith>=0.11.1",
    "lxml>=6.1",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loader", "src/util"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: runs the real benchmark against the benchmark papers"]
