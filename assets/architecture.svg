<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">arxiv-rag system architecture</title>
  <desc id="desc">A simple three-part diagram. The live question path routes a user question to paper retrieval or friendly chat, generates a grounded answer, and renders exact paragraph links. The offline knowledge pipeline turns arXiv HTML into anchored chunks and a Chroma vector index. Frozen benchmarks measure source loading, retrieval, answers, the complete pipeline, and safety.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .lane-title { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .node-title { font: 700 17px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .node-copy { font: 400 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .step { font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
      .edge-label { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .metric { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #92400e; }
      .metric-copy { font: 400 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #78350f; }
      .legend { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f8fafc"/>
  <circle cx="76" cy="67" r="27" fill="#2563eb"/>
  <path d="M64 67h24M76 55v24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.92"/>
  <text x="118" y="64" class="title">arxiv-rag architecture</text>
  <text x="118" y="92" class="subtitle">Every paper answer follows one evidence path—from anchored source text to a cited response.</text>

  <g transform="translate(1000,52)">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="22" y="12" class="legend">Live question path</text>
    <rect x="145" y="0" width="14" height="14" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="167" y="12" class="legend">Knowledge build</text>
    <rect x="282" y="0" width="14" height="14" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="304" y="12" class="legend">Quality gates</text>
  </g>

  <rect x="40" y="130" width="1360" height="320" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="40" y="130" width="1360" height="42" rx="22" fill="#dbeafe"/>
  <rect x="40" y="150" width="1360" height="22" fill="#dbeafe"/>
  <text x="66" y="157" class="lane-title" fill="#1d4ed8">LIVE QUESTION PATH</text>
  <text x="1230" y="157" class="node-copy" fill="#1d4ed8">online · bounded</text>

  <g filter="url(#shadow)">
    <rect x="80" y="215" width="180" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="105" cy="239" r="15" fill="#2563eb"/>
    <text x="105" y="244" text-anchor="middle" class="step">1</text>
    <text x="128" y="244" class="node-title">Ask a question</text>
    <text x="100" y="276" class="node-copy">Streamlit UI or CLI</text>
    <text x="100" y="298" class="node-copy">Standard / Easy mode</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="310" y="215" width="190" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="335" cy="239" r="15" fill="#2563eb"/>
    <text x="335" y="244" text-anchor="middle" class="step">2</text>
    <text x="358" y="244" class="node-title">Route request</text>
    <text x="330" y="276" class="node-copy">LangGraph resolves intent</text>
    <text x="330" y="298" class="node-copy">and follow-up context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="550" y="215" width="190" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="575" cy="239" r="15" fill="#2563eb"/>
    <text x="575" y="244" text-anchor="middle" class="step">3</text>
    <text x="598" y="244" class="node-title">Find evidence</text>
    <text x="570" y="276" class="node-copy">Top-5 vector retrieval</text>
    <text x="570" y="298" class="node-copy">Exact source passages</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="215" width="190" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="815" cy="239" r="15" fill="#2563eb"/>
    <text x="815" y="244" text-anchor="middle" class="step">4</text>
    <text x="838" y="244" class="node-title">Write answer</text>
    <text x="810" y="276" class="node-copy">Grounded Ollama model</text>
    <text x="810" y="298" class="node-copy">Full, partial, or decline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="205" width="310" height="125" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="1057" cy="231" r="15" fill="#059669"/>
    <text x="1057" y="236" text-anchor="middle" class="step">5</text>
    <text x="1080" y="236" class="node-title">Answer + exact source links</text>
    <text x="1053" y="270" class="node-copy">Unknown IDs and model-written URLs</text>
    <text x="1053" y="292" class="node-copy">are rejected; code renders trusted</text>
    <text x="1053" y="314" class="node-copy">arXiv paragraph links.</text>
  </g>

  <g>
    <rect x="550" y="360" width="270" height="62" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="685" y="385" text-anchor="middle" class="node-title" font-size="15">Friendly chat response</text>
    <text x="685" y="406" text-anchor="middle" class="node-copy">Greetings and recall · no paper search</text>
  </g>

  <path d="M260 267 H298" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M500 267 H538" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M740 267 H778" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M980 267 H1018" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M405 320 V341 H685 V348" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <rect x="506" y="244" width="90" height="20" rx="10" fill="#eff6ff"/>
  <text x="551" y="258" text-anchor="middle" class="edge-label">paper query</text>
  <text x="427" y="346" class="edge-label">chat route</text>

  <rect x="40" y="490" width="1360" height="180" rx="22" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <rect x="40" y="490" width="1360" height="42" rx="22" fill="#ccfbf1"/>
  <rect x="40" y="510" width="1360" height="22" fill="#ccfbf1"/>
  <text x="66" y="517" class="lane-title" fill="#0f766e">OFFLINE KNOWLEDGE BUILD</text>
  <text x="1177" y="517" class="node-copy" fill="#0f766e">reproducible · atomically activated</text>

  <g filter="url(#shadow)">
    <rect x="80" y="555" width="155" height="78" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <text x="157.5" y="584" text-anchor="middle" class="node-title">arXiv HTML</text>
    <text x="157.5" y="608" text-anchor="middle" class="node-copy">Structured source</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="290" y="555" width="155" height="78" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <text x="367.5" y="584" text-anchor="middle" class="node-title">Custom loader</text>
    <text x="367.5" y="608" text-anchor="middle" class="node-copy">Text + anchors</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="500" y="555" width="175" height="78" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <text x="587.5" y="584" text-anchor="middle" class="node-title">Citation-aware chunks</text>
    <text x="587.5" y="608" text-anchor="middle" class="node-copy">Context + provenance</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="730" y="555" width="165" height="78" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
    <text x="812.5" y="584" text-anchor="middle" class="node-title">Qwen embeddings</text>
    <text x="812.5" y="608" text-anchor="middle" class="node-copy">Semantic vectors</text>
  </g>
  <g filter="url(#shadow)">
    <path d="M960 570 C960 550 1130 550 1130 570 V619 C1130 639 960 639 960 619 Z" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
    <ellipse cx="1045" cy="570" rx="85" ry="15" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
    <text x="1045" y="594" text-anchor="middle" class="node-title">Chroma index</text>
    <text x="1045" y="617" text-anchor="middle" class="node-copy">384 retrieval documents</text>
  </g>

  <path d="M235 594 H278" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M445 594 H488" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M675 594 H718" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M895 594 H948" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M1045 555 V470 H850 V335 H645 V332" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="874" y="458" width="142" height="22" rx="11" fill="#f0fdfa"/>
  <text x="945" y="473" text-anchor="middle" class="edge-label" fill="#0f766e">similarity search</text>

  <rect x="40" y="710" width="1360" height="150" rx="22" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="40" y="710" width="1360" height="42" rx="22" fill="#fef3c7"/>
  <rect x="40" y="730" width="1360" height="22" fill="#fef3c7"/>
  <text x="66" y="737" class="lane-title" fill="#b45309">FROZEN BENCHMARKS AT EVERY LAYER</text>
  <text x="1130" y="737" class="node-copy" fill="#92400e">measure → inspect → improve</text>

  <g>
    <rect x="90" y="775" width="270" height="58" rx="13" fill="#ffffff" stroke="#fbbf24"/>
    <text x="225" y="799" text-anchor="middle" class="metric">Source integrity</text>
    <text x="225" y="820" text-anchor="middle" class="metric-copy">1,211 / 1,211 valid anchors</text>
  </g>
  <g>
    <rect x="390" y="775" width="270" height="58" rx="13" fill="#ffffff" stroke="#fbbf24"/>
    <text x="525" y="799" text-anchor="middle" class="metric">Retrieval quality</text>
    <text x="525" y="820" text-anchor="middle" class="metric-copy">95.83% Evidence Recall@8</text>
  </g>
  <g>
    <rect x="690" y="775" width="270" height="58" rx="13" fill="#ffffff" stroke="#fbbf24"/>
    <text x="825" y="799" text-anchor="middle" class="metric">Answer quality</text>
    <text x="825" y="820" text-anchor="middle" class="metric-copy">grounding · facts · citations</text>
  </g>
  <g>
    <rect x="990" y="775" width="350" height="58" rx="13" fill="#ffffff" stroke="#fbbf24"/>
    <text x="1165" y="799" text-anchor="middle" class="metric">End-to-end + safety</text>
    <text x="1165" y="820" text-anchor="middle" class="metric-copy">97.92% fact coverage · controlled attacks</text>
  </g>
</svg>
